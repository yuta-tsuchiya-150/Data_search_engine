{% extends "base.html" %}

{% block title %}会員登録 - データ検索エンジン{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-6 text-center">無料会員アカウント作成</h1>
    
    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 text-sm mb-4 rounded">
        {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">ユーザー名</label>
            <input type="text" name="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-900 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">メールアドレス</label>
            <input type="email" name="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-900 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">パスワード</label>
            <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-900 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="pt-2">
            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold py-2.5 rounded-lg transition shadow">
                アカウントを作成して登録
            </button>
        </div>
        <p class="text-[11px] text-slate-500 text-center leading-relaxed pt-1">
            ご登録いただくことで、当サービスの <a href="/privacy" target="_blank" class="text-indigo-600 font-bold underline">個人情報保護方針・セキュリティ規定</a> に同意したものとみなされます。
        </p>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
        すでにアカウントをお持ちの方は <a href="/login" class="text-indigo-600 font-bold underline">ログイン</a>
    </p>
</div>
{% endblock %}
