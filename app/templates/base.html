<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataSearchHub - 小学校お受験＆進学塾データ検索エンジン{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col text-slate-800">

    <!-- Header Navigation -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center">
            <a href="/" class="flex items-center space-x-2 text-xl font-bold tracking-wide">
                <i class="fa-solid fa-magnifying-glass-location text-amber-400"></i>
                <span>DataSearch<span class="text-amber-400">Hub</span></span>
            </a>
            
            <!-- Desktop / Mobile Nav -->
            <nav class="flex items-center space-x-4 md:space-x-6 text-sm font-medium mt-2 sm:mt-0">
                <a href="/" class="hover:text-amber-300 transition flex items-center">
                    <i class="fa-solid fa-list-ul mr-1.5 text-amber-400"></i>イベント検索
                </a>
                <a href="/calendar" class="hover:text-amber-300 transition flex items-center">
                    <i class="fa-regular fa-calendar-days mr-1.5 text-amber-400"></i>カレンダー
                </a>
                <a href="/schools" class="hover:text-amber-300 transition hidden sm:inline-flex items-center">
                    <i class="fa-solid fa-school mr-1.5 text-slate-300"></i>学校・塾一覧
                </a>
                <a href="/admin" class="hover:text-amber-300 transition hidden md:inline-flex items-center text-indigo-200">
                    <i class="fa-solid fa-sliders mr-1.5"></i>収集設定 (YAML)
                </a>

                {% if user %}
                    <a href="/dashboard" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-600 transition flex items-center">
                        <i class="fa-regular fa-user mr-1.5 text-amber-400"></i> {{ user.username }}
                    </a>
                    <a href="/logout" class="text-xs text-slate-300 hover:text-red-300">ログアウト</a>
                {% else %}
                    <a href="/login" class="hover:text-amber-300 transition">ログイン</a>
                    <a href="/register" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 px-3 py-1.5 rounded-lg font-bold text-xs transition">無料会員登録</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <!-- Global Alert / Messages -->
    {% if message %}
    <div class="bg-indigo-100 border-l-4 border-indigo-500 text-indigo-700 p-4 max-w-7xl mx-auto my-3 w-full" role="alert">
        <p>{{ message }}</p>
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 mt-16 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm space-y-2">
            <p class="font-bold text-slate-300">DataSearchHub - 汎用Webデータ自動収集 ＆ 小学校お受験ポータル</p>
            <p class="text-xs text-slate-500">&copy; 2026 DataSearchHub All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
