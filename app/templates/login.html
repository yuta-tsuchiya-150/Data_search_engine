{% extends "base.html" %}

{% block title %}ログイン - データ検索エンジン{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-6 text-center">アカウント ログイン</h1>
    
    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 text-sm mb-4 rounded">
        {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">ユーザー名</label>
            <input type="text" name="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-900 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">パスワード</label>
            <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-900 focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-lg transition shadow">
            ログイン
        </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
        アカウントをお持ちでない方は <a href="/register" class="text-indigo-600 font-bold underline">新規会員登録</a> へ
    </p>
</div>
{% endblock %}
