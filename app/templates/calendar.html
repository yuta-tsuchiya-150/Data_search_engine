{% extends "base.html" %}

{% block title %}月間カレンダー ＆ Googleカレンダー連携 - DataSearchHub{% endblock %}

{% block content %}
<div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 flex items-center">
            <i class="fa-regular fa-calendar-days text-amber-500 mr-3"></i>月間イベントカレンダー
        </h1>
        <p class="text-slate-500 text-xs md:text-sm mt-1">収集されたすべての説明会・見学会・模試・出願日程を月ごとに一目で把握できます。Googleカレンダー連携・.ics保存も可能です。</p>
    </div>

    <!-- Calendar View Controls & Export Buttons -->
    <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center space-x-1 bg-white p-1 rounded-xl border border-slate-200 shadow-sm text-xs font-bold">
            <button id="filter-all-btn" onclick="switchCalendarFilter(false)" class="px-3 py-1.5 rounded-lg transition {% if not favorite_only %}bg-indigo-900 text-white{% else %}bg-slate-100 text-slate-700 hover:bg-slate-200{% endif %}">
                すべてのイベント
            </button>
            {% if user %}
            <button id="filter-fav-btn" onclick="switchCalendarFilter(true)" class="px-3 py-1.5 rounded-lg transition {% if favorite_only %}bg-indigo-900 text-white{% else %}bg-slate-100 text-slate-700 hover:bg-slate-200{% endif %}">
                <i class="fa-solid fa-heart text-rose-500 mr-1"></i>お気に入り学校のみ
            </button>
            {% endif %}
        </div>

        <a href="/api/user-calendar-feed.ics" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-extrabold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center">
            <i class="fa-solid fa-download mr-1.5"></i> iCal (.ics) 一括保存
        </a>
    </div>
</div>

<!-- Calendar Main Container -->
<div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
    <div id="calendar"></div>
</div>

<!-- Event Detail Modal (Popup with Google Calendar & iCal Export) -->
<div id="eventModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-5 border border-slate-200 transform transition-all">
        <div class="flex justify-between items-start border-b border-slate-100 pb-3">
            <div>
                <div class="flex flex-wrap items-center gap-2">
                    <span id="modalSource" class="text-xs font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded shadow-sm"></span>
                    <span id="modalCategory" class="text-xs font-extrabold bg-amber-100 text-amber-800 px-2.5 py-1 rounded shadow-sm"></span>
                </div>
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900 mt-2 leading-snug"></h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 text-xl leading-none">&times;</button>
        </div>


        <div class="space-y-3 text-xs text-slate-600">
            <div class="flex items-center space-x-2 text-amber-600 font-bold">
                <i class="fa-regular fa-calendar text-sm"></i>
                <span id="modalDate"></span>
            </div>
            <div class="flex items-center space-x-2 text-slate-700 font-medium">
                <i class="fa-solid fa-location-dot text-sm text-slate-400"></i>
                <span id="modalLocation"></span>
            </div>
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mt-2">
                <p id="modalContent" class="leading-relaxed text-slate-700 whitespace-pre-line"></p>
            </div>
        </div>

        <!-- Integration Actions -->
        <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 flex flex-wrap gap-2 text-xs font-bold">
            <a id="gcalBtn" href="#" target="_blank" class="flex-1 bg-white hover:bg-indigo-50 text-indigo-900 border border-indigo-200 py-2 px-3 rounded-lg text-center shadow-sm transition flex items-center justify-center">
                <i class="fa-brands fa-google mr-1.5 text-red-500"></i> Googleカレンダーに追加
            </a>
            <a id="icalBtn" href="#" class="flex-1 bg-white hover:bg-indigo-50 text-indigo-900 border border-indigo-200 py-2 px-3 rounded-lg text-center shadow-sm transition flex items-center justify-center">
                <i class="fa-solid fa-file-export mr-1.5 text-indigo-600"></i> .ics ファイル保存
            </a>
        </div>

        <div class="flex justify-end space-x-3 pt-1">
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">
                閉じる
            </button>
            <a id="modalUrl" href="#" target="_blank" class="px-4 py-2 bg-indigo-900 hover:bg-indigo-800 text-white rounded-lg text-xs font-bold shadow transition flex items-center">
                公式サイトで見る <i class="fa-solid fa-up-right-from-square ml-1.5"></i>
            </a>
        </div>
    </div>
</div>

<script>
var calendar;
var currentFavOnly = {{ 'true' if favorite_only else 'false' }};

function getOfficialUrlJS(sourceName, eventTitle, rawUrl) {
    if (rawUrl && !rawUrl.includes('127.0.0.1') && !rawUrl.includes('localhost') && !rawUrl.includes('example.com') && (rawUrl.startsWith('http://') || rawUrl.startsWith('https://'))) {
        return rawUrl;
    }
    var text = (sourceName || '') + ' ' + (eventTitle || '');
    if (text.includes('慶應')) return 'https://www.yochisha.keio.ac.jp/';
    if (text.includes('早稲田')) return 'https://www.wasedajitsugyo.ed.jp/elementary/';
    if (text.includes('青山')) return 'https://www.age.aoyama.ed.jp/';
    if (text.includes('立教')) return 'https://primary.rikkyo.ac.jp/';
    if (text.includes('学習院')) return 'https://www.gakushuin.ac.jp/prim/';
    if (text.includes('こぐま')) return 'https://www.kogumakai.co.jp/';
    if (text.includes('ジャック')) return 'https://www.jac-youjikyouiku.com/';
    if (text.includes('理英会')) return 'https://www.rieikai.com/';
    if (text.includes('伸芽会')) return 'https://www.shingakai.co.jp/';
    if (text.includes('ITパスポート')) return 'https://www.itpassportsiken.jp/';
    return 'https://www.google.com/search?q=' + encodeURIComponent((sourceName || '小学校お受験') + ' 公式サイト');
}

document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        height: 'auto',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        buttonText: {
            today: '今月',
            month: '月',
            week: '週'
        },
        events: function(fetchInfo, successCallback, failureCallback) {
            var url = '/api/calendar-events?favorite_only=' + currentFavOnly + '&_t=' + new Date().getTime();
            fetch(url, { cache: 'no-store' })
                .then(response => response.json())
                .then(data => successCallback(data))
                .catch(error => failureCallback(error));
        },
        eventClick: function(info) {
            info.jsEvent.preventDefault();
            var props = info.event.extendedProps || {};
            var targetEventId = info.event.id || props.event_id || props.id;
            
            document.getElementById('modalSource').innerText = props.source_name || '';
            document.getElementById('modalCategory').innerText = props.category_label || props.category_badge || 'イベント';
            document.getElementById('modalTitle').innerText = props.raw_title || info.event.title;
            document.getElementById('modalDate').innerText = '開催/試験日: ' + (props.event_date || '未定');
            document.getElementById('modalLocation').innerText = '会場: ' + (props.location || '未指定');
            document.getElementById('modalContent').innerText = props.content || '詳細情報はありません。';


            var resolvedUrl = getOfficialUrlJS(props.source_name, props.raw_title || info.event.title, props.official_url || info.event.url);
            document.getElementById('modalUrl').href = resolvedUrl;

            // Google カレンダー ＆ .ics ボタンの表示設定
            var gcalBtn = document.getElementById('gcalBtn');
            var icalBtn = document.getElementById('icalBtn');

            if (props.google_calendar_url) {
                gcalBtn.href = props.google_calendar_url;
                gcalBtn.style.display = 'inline-flex';
            } else {
                gcalBtn.style.display = 'none';
            }

            if (targetEventId && targetEventId !== 'undefined') {
                icalBtn.href = '/events/' + targetEventId + '/ical';
                icalBtn.style.display = 'inline-flex';
            } else {
                icalBtn.style.display = 'none';
            }

            document.getElementById('eventModal').classList.remove('hidden');
        }
    });
    calendar.render();
});

function switchCalendarFilter(favOnly) {
    currentFavOnly = favOnly;
    var allBtn = document.getElementById('filter-all-btn');
    var favBtn = document.getElementById('filter-fav-btn');

    if (favOnly) {
        favBtn.className = "px-3 py-1.5 rounded-lg transition bg-indigo-900 text-white";
        allBtn.className = "px-3 py-1.5 rounded-lg transition bg-slate-100 text-slate-700 hover:bg-slate-200";
    } else {
        allBtn.className = "px-3 py-1.5 rounded-lg transition bg-indigo-900 text-white";
        if (favBtn) favBtn.className = "px-3 py-1.5 rounded-lg transition bg-slate-100 text-slate-700 hover:bg-slate-200";
    }

    if (calendar) {
        calendar.refetchEvents();
    }
}

function closeModal() {
    document.getElementById('eventModal').classList.add('hidden');
}
</script>
{% endblock %}
