<!-- お受験AIサポートコンシェルジュ 浮遊チャットWidget -->
<div id="ai-chat-widget" class="fixed bottom-5 right-5 z-50 font-sans">
    
    <!-- 浮遊トグルボタン -->
    <button type="button" onclick="toggleAiChatWindow()" id="ai-chat-toggle-btn" class="bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-indigo-950 font-extrabold px-4 py-3 rounded-full shadow-2xl transition transform hover:scale-105 flex items-center space-x-2 border border-amber-300">
        <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <i class="fa-solid fa-robot text-lg"></i>
        <span class="text-xs tracking-wide">お受験AI相談</span>
    </button>

    <!-- チャットモーダルウィンドウ (初期状態: 非表示 - スマホでは固定フルスクリーン/ボトムシート、PCでは右下フロート) -->
    <div id="ai-chat-window" class="hidden fixed inset-x-2 bottom-16 top-16 sm:top-auto sm:bottom-5 sm:right-5 sm:left-auto w-auto sm:w-[420px] h-auto sm:h-[540px] bg-slate-900 text-slate-100 rounded-2xl shadow-2xl border border-slate-700/80 flex flex-col overflow-hidden backdrop-blur-xl z-50">
        
        <!-- ウィンドウヘッダー -->
        <div class="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 px-4 py-3.5 border-b border-slate-700/60 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-amber-400 text-indigo-950 flex items-center justify-center font-bold text-sm shadow">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-white flex items-center">
                        お受験AIコンシェルジュ
                        <span class="ml-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[9px] px-1.5 py-0.2 rounded font-mono">Gemini AI</span>
                    </h3>
                    <p class="text-[10px] text-slate-400">YouTube解説・資料・最新日程データをハイブリッド参照</p>
                </div>
            </div>
            <button type="button" onclick="toggleAiChatWindow()" class="text-slate-400 hover:text-white text-lg p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- チャット会話ログ表示領域 -->
        <div id="ai-chat-messages" class="flex-grow p-4 overflow-y-auto space-y-3.5 text-xs text-slate-200">
            <!-- AI Welcoming Message -->
            <div class="flex items-start space-x-2">
                <div class="w-6 h-6 rounded-full bg-amber-400/20 border border-amber-400/40 text-amber-300 flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                    🤖
                </div>
                <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-3 max-w-[85%] space-y-2">
                    <p class="font-bold text-amber-300 text-xs">こんにちは！小学校お受験＆進学塾AIコンシェルジュです。</p>
                    <p class="text-slate-300 leading-relaxed">
                        YouTubeの合格解説動画や願書・面接資料、カレンダー情報を学習しています。
                    </p>
                    <div class="p-2 bg-purple-900/40 border border-purple-500/30 rounded-xl text-[11px] text-purple-200">
                        <p class="font-bold text-amber-300 mb-0.5"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>マイカレンダー自動連携機能</p>
                        お子様の模試案内や塾の予定（例:「10月25日 伸芽会秋期模試」）をメッセージ入力すると、AIが日程を解析してマイカレンダーへ自動登録します！
                    </div>
                    <p class="text-[11px] text-slate-400">下記の気になる質問チップをタップするか、自由に入力してください。</p>
                </div>
            </div>

            <!-- クイック質問チップ群 -->
            <div class="pt-1 pb-2">
                <p class="text-[10px] font-bold text-slate-400 mb-1.5 flex items-center">
                    <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>おすすめクイック相談:
                </p>
                <div class="flex flex-wrap gap-1.5">
                    <button type="button" onclick="sendQuickQuestion('10月25日に理英会の秋期模試があります。マイカレンダーに追加して')" class="bg-purple-950/80 hover:bg-purple-900 border border-purple-500/60 text-purple-200 hover:text-white px-2.5 py-1.5 rounded-lg text-[11px] transition text-left">
                        🗓️ 10月25日 模試の予定を登録
                    </button>
                    <button type="button" onclick="sendQuickQuestion('立教小学校の願書・志望理由のポイントを教えて')" class="bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-200 hover:text-white px-2.5 py-1.5 rounded-lg text-[11px] transition text-left">
                        📌 立教小学校の願書ポイント
                    </button>
                    <button type="button" onclick="sendQuickQuestion('理英会やジャックの模試活用法と復習のコツは？')" class="bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-200 hover:text-white px-2.5 py-1.5 rounded-lg text-[11px] transition text-left">
                        📌 理英会・ジャックの模試活用法
                    </button>
                    <button type="button" onclick="sendQuickQuestion('保護者面接とお子様面接で気を付けるマナーは？')" class="bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-200 hover:text-white px-2.5 py-1.5 rounded-lg text-[11px] transition text-left">
                        📌 保護者・お子様面接のマナー
                    </button>
                </div>
            </div>
        </div>

        <!-- ローディング表示 (非表示) -->
        <div id="ai-chat-loading" class="hidden px-4 py-2 bg-slate-900/90 text-amber-400 text-xs flex items-center space-x-2 border-t border-slate-800">
            <i class="fa-solid fa-circle-notch fa-spin text-sm"></i>
            <span>Gemini AI ナレッジ＆カレンダーデータを参照し回答生成中...</span>
        </div>

        <!-- 入力エリア -->
        <div class="p-3 bg-slate-950 border-t border-slate-800">
            <form id="ai-chat-form" onsubmit="submitAiChat(event)" class="flex items-center space-x-2">
                <input type="text" id="ai-chat-input" placeholder="質問や予定を入力... (例: 10月20日 伸芽会模試)" class="flex-grow bg-slate-900 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-amber-400">
                <button type="submit" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold px-3.5 py-2 rounded-xl text-xs shadow transition flex items-center shrink-0">
                    <i class="fa-solid fa-paper-plane mr-1 text-[10px]"></i>送信
                </button>
            </form>
        </div>

    </div>
</div>

<script>
function toggleAiChatWindow() {
    var win = document.getElementById('ai-chat-window');
    var btn = document.getElementById('ai-chat-toggle-btn');
    if (win.classList.contains('hidden')) {
        win.classList.remove('hidden');
        btn.classList.add('hidden');
        document.getElementById('ai-chat-input').focus();
    } else {
        win.classList.add('hidden');
        btn.classList.remove('hidden');
    }
}

function sendQuickQuestion(text) {
    document.getElementById('ai-chat-input').value = text;
    var event = new Event('submit', { cancelable: true });
    document.getElementById('ai-chat-form').dispatchEvent(event);
}

function submitAiChat(e) {
    e.preventDefault();
    var inputEl = document.getElementById('ai-chat-input');
    var text = inputEl.value.trim();
    if (!text) return;

    var logsContainer = document.getElementById('ai-chat-messages');

    // 1. ユーザー発言バブルの追加
    var userBubble = document.createElement('div');
    userBubble.className = "flex items-start justify-end space-x-2";
    userBubble.innerHTML = `
        <div class="bg-amber-400 text-indigo-950 font-medium rounded-2xl px-3.5 py-2 max-w-[85%] text-xs shadow-sm">
            ${escapeHtml(text)}
        </div>
    `;
    logsContainer.appendChild(userBubble);
    inputEl.value = '';
    logsContainer.scrollTop = logsContainer.scrollHeight;

    // 2. ローディング表示
    document.getElementById('ai-chat-loading').classList.remove('hidden');

    // 3. API呼び出し
    var formData = new FormData();
    formData.append('query', text);

    fetch('/api/ai-chat', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('ai-chat-loading').classList.add('hidden');

        var aiBubble = document.createElement('div');
        aiBubble.className = "flex items-start space-x-2";
        
        var answerHtml = data.answer || "申し訳ございません。回答を取得できませんでした。";

        aiBubble.innerHTML = `
            <div class="w-6 h-6 rounded-full bg-amber-400/20 border border-amber-400/40 text-amber-300 flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                🤖
            </div>
            <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-3.5 max-w-[85%] space-y-1.5 leading-relaxed text-xs text-slate-200">
                ${answerHtml}
            </div>
        `;
        logsContainer.appendChild(aiBubble);
        logsContainer.scrollTop = logsContainer.scrollHeight;
    })
    .catch(err => {
        document.getElementById('ai-chat-loading').classList.add('hidden');
        console.error("AI Chat Error:", err);
    });
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>
